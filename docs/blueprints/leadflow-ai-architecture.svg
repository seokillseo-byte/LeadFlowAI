<path d="M680 655 V710" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1015 655 V710" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1160 655 V710" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="55" y="995" width="1490" height="62" rx="28" fill="#e8eef7"/>
<text x="800" y="1021" text-anchor="middle" class="t">1 Discover → 2 Normalize → 3 Match → 4 Deduplicate → 5 AI Analyze → 6 Suggest → 7 Human Review → 8 Approve → 9 Queue → 10 Execute → 11 Audit</text>
<text x="800" y="1044" text-anchor="middle" class="s">Invariant: AI never authorizes outbound action; provider capability and server-side approval checks are mandatory.</text>
</svg>